name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: 
  contents: write

jobs:
  download-artifacts:
    name: Download CI Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get last successful CI run ID
        id: get-run-id
        run: |
          # Query GitHub API for last successful ci.yml workflow run on main branch
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json=databaseId \
            --jq='.[0].databaseId')
          
          if [[ -z "$RUN_ID" ]]; then
            echo "Error: No successful CI runs found"
            exit 1
          fi
          
          echo "Last successful CI run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ steps.get-run-id.outputs.run_id }}
          path: dist/
          github_token: ${{ secrets.WORKFLOW_TOKEN }}
      
      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/
      
  release: 
    name: Create Release
    needs: [download-artifacts]
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses:  actions/download-artifact@v4
        with:
          name:  release-binaries
          path:  dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with: 
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/handler-linux-x64-static
            dist/misp2sentinel-cli-linux-x64-static
            dist/misp2sentinel-cli-linux-x64
            dist/misp2sentinel-cli-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}