[workspace]
resolver = "2"
members = [
    "misp2sentinel-core",
    "misp2sentinel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["infernux.no"]
license = "MIT"
repository = "https://github.com/lnfernux/rustymisp2sentinel"
description = "Rust implementation of MISP to Microsoft Sentinel threat intelligence sync"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "form", "rustls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Azure SDK
azure_identity = "0.32"
azure_security_keyvault_secrets = "0.9"
azure_core = "0.31"

# UUID generation
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Parallel/concurrent processing
rayon = "1.11"
futures = "0.3"
tokio-stream = "0.1"

# Progress bars and terminal UI
indicatif = { version = "0.18", features = ["rayon"] }
console = "0.16"
